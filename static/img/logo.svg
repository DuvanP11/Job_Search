<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>
  
  <!-- Círculo de fondo -->
  <circle cx="100" cy="100" r="90" fill="url(#grad1)"/>
  
  <!-- Maletín (trabajo) - centrado -->
  <g opacity="0.95">
    <rect x="65" y="100" width="45" height="32" rx="2" fill="#ffffff"/>
    <rect x="65" y="100" width="45" height="4" fill="rgba(255,255,255,0.6)"/>
    <path d="M 75 100 Q 87.5 92 100 100" stroke="#ffffff" stroke-width="2.5" fill="none"/>
    <rect x="85" y="110" width="5" height="12" fill="rgba(102,126,234,0.2)" rx="0.5"/>
    <circle cx="87.5" cy="116" r="1.5" fill="#667eea"/>
  </g>
  
  <!-- Lupa (búsqueda) - derecha -->
  <g opacity="0.95">
    <circle cx="125" cy="95" r="16" fill="none" stroke="#ffffff" stroke-width="3.5"/>
    <circle cx="125" cy="95" r="12" fill="rgba(255,255,255,0.05)"/>
    <line x1="136" y1="106" x2="146" y2="116" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="121" cy="91" r="4" fill="#ffffff" opacity="0.3"/>
  </g>
  
  <!-- Persona (ayuda personalizada) - arriba -->
  <g opacity="0.9">
    <circle cx="100" cy="75" r="6.5" fill="#ffffff"/>
    <path d="M 94 82 L 92 90 M 100 82 L 100 90 M 106 82 L 108 90" 
          stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  
  <!-- Líneas decorativas sutiles -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="100" cy="100" r="75" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
</svg>
