<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente principal -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    
    <!-- Filtro de sombra -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>
  
  <!-- Círculo de fondo con gradiente -->
  <circle cx="100" cy="100" r="90" fill="url(#mainGradient)" filter="url(#shadow)">
    <animate attributeName="r" values="90;92;90" dur="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Círculo interior para profundidad -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  
  <!-- Maletín (trabajo) -->
  <g transform="translate(70, 80)">
    <rect x="5" y="15" width="50" height="35" rx="3" fill="#ffffff" opacity="0.95"/>
    <rect x="5" y="15" width="50" height="5" fill="rgba(255,255,255,0.8)"/>
    <path d="M 20 15 Q 30 5 40 15" stroke="#ffffff" stroke-width="3" fill="none" opacity="0.95"/>
    <rect x="27" y="25" width="6" height="15" fill="rgba(102,126,234,0.3)" rx="1"/>
    <circle cx="30" cy="32" r="2" fill="url(#mainGradient)"/>
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-2; 0,0" dur="2s" repeatCount="indefinite"/>
  </g>
  
  <!-- Lupa (búsqueda) -->
  <g transform="translate(105, 95)">
    <circle cx="0" cy="0" r="20" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.95"/>
    <circle cx="0" cy="0" r="15" fill="rgba(255,255,255,0.1)"/>
    <line x1="14" y1="14" x2="28" y2="28" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.95"/>
    <circle cx="-5" cy="-5" r="5" fill="#ffffff" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.7;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <animateTransform attributeName="transform" type="rotate" values="0 0 0; 5 0 0; 0 0 0; -5 0 0; 0 0 0" dur="4s" repeatCount="indefinite"/>
  </g>
  
  <!-- Persona (ayuda personalizada) -->
  <g transform="translate(100, 65)">
    <circle cx="0" cy="0" r="8" fill="#ffffff" opacity="0.9"/>
    <path d="M -6 8 L -8 18 M 0 8 L 0 18 M 6 8 L 8 18" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <animateTransform attributeName="transform" type="scale" values="1;1.05;1" dur="2s" repeatCount="indefinite"/>
  </g>
  
  <!-- Partículas flotantes -->
  <circle cx="60" cy="60" r="2" fill="#ffffff" opacity="0.6">
    <animate attributeName="cy" values="60;50;60" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="140" r="2" fill="#ffffff" opacity="0.6">
    <animate attributeName="cy" values="140;150;140" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="130" r="2" fill="#ffffff" opacity="0.6">
    <animate attributeName="cx" values="50;45;50" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="70" r="2" fill="#ffffff" opacity="0.6">
    <animate attributeName="cx" values="150;155;150" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Anillo de pulso -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2">
    <animate attributeName="r" values="85;95;85" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
