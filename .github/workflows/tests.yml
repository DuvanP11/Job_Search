name: Tests

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"      # misma versión que runtime.txt
        cache: pip
    - name: Dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-dev.txt -r requirements-worker.txt
        python -m playwright install --with-deps chromium
    - name: Pruebas (incluye el motor de formularios con Chromium real contra ATS simulados en local)
      run: pytest -q
